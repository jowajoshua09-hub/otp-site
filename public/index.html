  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon">
          <svg viewBox="0 0 24 24" width="32" height="32"><use href="#icon-mail"/></svg>
        </span>
        <div>
          <h1>OTP Feed</h1>
          <p class="subtitle">Live verification codes from public numbers</p>
        </div>
      </div>
    </header>

    <section class="filter-bar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><use href="#icon-search"/></svg>
        <input id="search" type="search" placeholder="Search sender, country, or code..." />
      </div>
      <div class="filters">
        <select id="senderFilter"><option value="">All Senders</option></select>
        <select id="countryFilter"><option value="">All Countries</option></select>
        <button id="refresh" class="btn-refresh">
          <svg viewBox="0 0 24 24" width="16" height="16"><use href="#icon-refresh"/></svg>
          Refresh
        </button>
      </div>
      <span id="status" class="status-badge">Loading…</span>
    </section>

    <div id="stats" class="stats-bar"></div>

    <main id="grid" class="card-grid"></main>
  </div>

  <div id="toast" class="toast">
    <svg viewBox="0 0 24 24" width="18" height="18"><use href="#icon-check"/></svg>
    <span class="toast-text"></span>
  </div>

  <script src="/app.js"></script>
</body>
  </html>
